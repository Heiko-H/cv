headline: Full-Stack Web Developer
summary: >-
  Full-stack web developer with 14+ years of experience building and integrating web applications
  with PHP/Symfony, TypeScript, React and Vue. Certified Pimcore Enterprise Developer with deep
  experience in PIM, MDM, DAM and CMS platforms and API-based system integration. Combines
  hands-on engineering with team leadership and requirements engineering to turn business needs
  into maintainable, well-structured solutions.

skills:
  - category: Languages
    items: [PHP, TypeScript, JavaScript, SQL, HTML & CSS]
  - category: Frameworks & Frontend
    items: [Symfony, React, Vue.js, REST APIs, Responsive Web Design]
  - category: Platforms
    items: [Pimcore, TYPO3, "PIM, MDM & DAM", Content Management Systems]
  - category: Data & Integration
    items: [MySQL, Database Design & Data Modelling, Query Optimization, System Integration]
  - category: Tools & Practices
    items: [Docker, Git, Code Quality & Reviews, Requirements Engineering, Mentoring]

work:
  ri-werkstattservice:
    bullets:
      - Translate business needs across 8 internal applications into clear technical requirements and implementation-ready specifications for development partners.
      - Analyze 10+ complex business processes to identify system dependencies, integration points and improvement opportunities.
      - Coordinate technical implementation with development partners, assessing impact, dependencies and priorities across systems.
  travix:
    positions:
      lead:
        bullets:
          - Led a team of up to 9 developers, providing technical guidance, feedback and quality oversight across multiple concurrent projects.
          - Delivered 12+ software projects for 11+ clients, from requirements analysis and solution design through implementation and launch.
          - Mentored and onboarded 5 developers, accelerating their ramp-up on the codebase, stack and delivery process.
      dev:
        bullets:
          - Built 10+ web applications for 10+ clients with PHP/Symfony, JavaScript and the Pimcore and TYPO3 platforms.
          - Developed scalable system integrations and APIs connecting web platforms with client systems for product, master and digital asset data.
  html-design:
    bullets:
      - Developed and maintained websites and software for 4 clients across 5+ projects.
      - Optimized database queries, reducing processing times from 4-5 seconds to under 1 second.
      - Designed databases, data models and schemas for reliable data storage and retrieval.
