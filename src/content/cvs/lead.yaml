headline: Technical Team Lead
summary: >-
  Technology professional with 14+ years of experience across web development, technical delivery,
  project leadership and team management. Led teams of up to 9 developers and 2 project managers,
  onboarded and mentored 5 developers, and managed delivery across 12+ software projects for 11+
  clients. Combines a hands-on web development background with experience in technical
  coordination, requirements, quality oversight and stakeholder communication.

skills:
  - category: Leadership & Team Development
    items: [Team Leadership, Developer Onboarding & Mentoring, Workload & Priority Coordination, Technical Guidance, Feedback & Coaching, Stakeholder Communication]
  - category: Technical Delivery
    items: [Software Delivery Coordination, Requirements Engineering, Solution Design, Project Planning & Estimation, Quality Assurance, Code Reviews, Issue Resolution]
  - category: Software & Systems
    items: [PHP / Symfony, JavaScript / TypeScript, SQL / MySQL, APIs & System Integration, Web Applications & CMS, React / Vue, Docker]

work:
  ri-werkstattservice:
    bullets:
      - Coordinate requirements and technical implementation across 8 applications, working with management, users and development partners.
      - Analysed 10+ complex business processes to identify dependencies and improvements across users, workflows and systems.
      - Coordinate priorities and technical dependencies across applications and development partners.
      - Help users and technical teams reach a shared understanding of problems, requirements and practical solutions.
  travix:
    positions:
      lead:
        bullets:
          - Led teams of up to 9 developers and 2 project managers across multiple client projects.
          - Managed 12+ software projects for 11+ clients, coordinating technical delivery from requirements through implementation and launch.
          - Coordinated workloads, dependencies, priorities, scope, resources and delivery timelines.
          - Onboarded and mentored 5 developers and provided technical guidance, feedback, code reviews and quality oversight.
          - Acted as a key link between clients, project stakeholders and development teams to resolve issues and manage changing requirements.
      dev:
        bullets:
          - Delivered 10+ web projects for 10+ clients and developed web applications and system integrations.
          - Translated customer requirements into technical solutions and built a strong hands-on foundation in web development.
  html-design:
    bullets:
      - Developed and maintained websites and software for 4 clients across 5+ projects.
      - Reduced database query processing time from 4–5 seconds to under 1 second through query optimisation.
      - Designed databases, data models and schemas for reliable data storage and retrieval.
