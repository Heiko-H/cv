name: Build & deploy resumes

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages serves the project repository under /cv; locally the base is /.
      CV_BASE: /cv
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # Plaintext only lives in GitHub Secrets; the build fails if any is missing.
          CV_EMAIL: ${{ secrets.CV_EMAIL }}
          CV_PHONE: ${{ secrets.CV_PHONE }}
          CV_LOCATION: ${{ secrets.CV_LOCATION }}

      - name: Check that no contact details leak in plaintext
        run: npm run check:secrets
        env:
          CV_EMAIL: ${{ secrets.CV_EMAIL }}
          CV_PHONE: ${{ secrets.CV_PHONE }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check that every resume fits on one Letter page
        run: npm run check:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
